<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文化盲盒抽抽乐 · Band 3&amp;4</title>
  <style>
    :root {
      --bg-paper: #f7f2e7;
      --card-cream: #fdfaf3;
      --ink-dark: #2c241b;
      --ink-muted: #6b5e4f;
      --cinnabar: #b83227;
      --gold: #c8963e;
      --jade: #2e6f5e;
      --shadow-soft: 0 10px 28px rgba(44, 36, 27, 0.12);
      --shadow-card: 0 16px 40px rgba(44, 36, 27, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(184, 50, 39, 0.06), transparent 36%),
        radial-gradient(circle at 88% 82%, rgba(200, 150, 62, 0.09), transparent 40%),
        var(--bg-paper);
      color: var(--ink-dark);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 28px;
      background: rgba(253, 250, 243, 0.94);
      border-bottom: 2px solid rgba(200, 150, 62, 0.35);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .seal-badge {
      background: var(--cinnabar);
      color: #fff8eb;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 248, 235, 0.6);
      letter-spacing: 1px;
    }
    .brand-title { font-size: 1.45rem; font-weight: 800; letter-spacing: 2px; }
    .band-tag {
      background: #efe5cf;
      color: #7c4d12;
      border: 1px solid #d7b97c;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      border-radius: 12px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: #efe6d5;
      color: var(--ink-dark);
      border: 1.5px solid #d5c29e;
      padding: 10px 16px;
      font-size: 0.95rem;
    }
    .btn-secondary:hover { background: #e6d8be; }
    .btn-primary {
      background: linear-gradient(135deg, #c93b2f, #9e2319);
      color: #fffaf0;
      padding: 13px 26px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      box-shadow: 0 6px 18px rgba(184, 50, 39, 0.28);
    }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-gold {
      background: linear-gradient(135deg, #d8a448, #b37e24);
      color: #fffdf8;
      padding: 13px 24px;
      font-size: 1.08rem;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(179, 126, 36, 0.28);
    }
    .btn-gold:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-jade {
      background: linear-gradient(135deg, #347b68, #23594b);
      color: #ffffff;
      padding: 13px 24px;
      font-size: 1.08rem;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(46, 111, 94, 0.28);
    }
    .btn-jade:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .container { max-width: 1180px; margin: 0 auto; padding: 24px 24px 52px; }
    .step-header { text-align: center; margin-bottom: 22px; }
    .step-pill {
      display: inline-block;
      background: rgba(184, 50, 39, 0.1);
      color: var(--cinnabar);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .step-title { font-size: 1.85rem; font-weight: 800; margin-bottom: 6px; }
    .step-subtitle { color: var(--ink-muted); font-size: 1.05rem; }
    .prop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 12px;
    }
    .prop-card {
      position: relative;
      background: var(--card-cream);
      border: 2px solid #e2cfa9;
      border-radius: 20px;
      padding: 22px 20px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      overflow: hidden;
    }
    .prop-card::before {
      content: "盲盒";
      position: absolute;
      top: 12px;
      right: -28px;
      background: var(--gold);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 32px;
      transform: rotate(35deg);
      letter-spacing: 1px;
    }
    .prop-card:hover {
      transform: translateY(-6px) rotate(-0.5deg);
      border-color: var(--cinnabar);
      box-shadow: 0 16px 32px rgba(184, 50, 39, 0.16);
    }
    .prop-icon-box {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: linear-gradient(145deg, #fff6e3, #f3e2c0);
      border: 1.5px solid #dec28c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
    }
    .prop-name-zh { font-size: 1.45rem; font-weight: 800; margin-bottom: 2px; }
    .prop-name-sub { font-size: 1.02rem; font-weight: 600; color: var(--cinnabar); margin-bottom: 4px; }
    .prop-name-en { font-size: 0.92rem; color: var(--ink-muted); margin-bottom: 12px; }
    .prop-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #5c4e3c;
      background: #f3ead8;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
    }
    .stage-panel { display: none; }
    .stage-panel.active { display: block; animation: fadeIn 0.28s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .blindbox-banner {
      background: var(--card-cream);
      border: 2px solid #dfc89c;
      border-radius: 22px;
      padding: 16px 24px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .selected-prop-info { display: flex; align-items: center; gap: 16px; }
    .selected-prop-emoji {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: #f8ecd4;
      border: 1.5px solid #d7b87c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .selected-prop-titles h2 { font-size: 1.42rem; font-weight: 800; }
    .selected-prop-titles p { font-size: 0.92rem; color: var(--ink-muted); }
    .pool-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pool-dots { display: flex; gap: 6px; align-items: center; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e2d5bc;
      border: 1px solid #c7b186;
    }
    .dot.used { background: var(--cinnabar); border-color: var(--cinnabar); transform: scale(0.85); }
    .dot.current { background: var(--gold); border-color: #8f6214; transform: scale(1.25); }
    .shaking { animation: boxShake 0.55s ease-in-out; }
    @keyframes boxShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-6deg) scale(1.03); }
      40% { transform: rotate(6deg) scale(1.04); }
      60% { transform: rotate(-4deg) scale(1.02); }
      80% { transform: rotate(4deg) scale(1.01); }
    }
    .question-card-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 760px;
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 2px solid #d5bc8c;
      background-color: #f8f3e6;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7% 11%;
    }
    .trilingual-board {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 252, 245, 0.93);
      border: 1.5px solid rgba(200, 150, 62, 0.48);
      border-radius: 20px;
      padding: 20px 26px;
      box-shadow: 0 8px 24px rgba(44, 36, 27, 0.08);
    }
    .card-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(107, 94, 79, 0.3);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--ink-muted);
    }
    .q-num-pill {
      background: var(--cinnabar);
      color: #fff;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .lang-block { padding: 9px 14px; border-radius: 14px; margin-bottom: 9px; }
    .lang-block.zh-simp { background: rgba(184, 50, 39, 0.06); border-left: 4px solid var(--cinnabar); }
    .lang-block.zh-trad { background: rgba(200, 150, 62, 0.1); border-left: 4px solid var(--gold); }
    .lang-block.en-lang { background: rgba(46, 111, 94, 0.08); border-left: 4px solid var(--jade); margin-bottom: 0; }
    .lang-label {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.85;
    }
    .zh-simp .lang-label { color: var(--cinnabar); }
    .zh-trad .lang-label { color: #9c6b14; }
    .en-lang .lang-label { color: var(--jade); }
    .lang-text {
      font-size: clamp(1.08rem, 2vw, 1.42rem);
      font-weight: 700;
      color: var(--ink-dark);
      word-break: break-word;
    }
    .en-lang .lang-text {
      font-size: clamp(0.98rem, 1.72vw, 1.24rem);
      font-weight: 600;
      line-height: 1.4;
    }
    .answer-box {
      display: none;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #e9f6ef;
      border: 2px solid #2e8b57;
      color: #165b33;
      animation: fadeIn 0.22s ease;
    }
    .answer-box.visible {
      display: block;
    }
    .answer-title {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #1b7a43;
      margin-bottom: 2px;
    }
    .answer-content {
      font-size: clamp(1.08rem, 1.9vw, 1.36rem);
      font-weight: 800;
    }
    .mark-tick {
      display: inline-block;
      color: #1b8a4b;
      font-family: "Segoe UI Symbol", "Apple Symbols", "Arial", sans-serif;
      font-weight: 900;
      font-size: 1.1em;
      padding: 0 2px;
    }
    .mark-cross {
      display: inline-block;
      color: #c62828;
      font-weight: 900;
      padding: 0 2px;
    }
    .empty-state {
      text-align: center;
      padding: 34px 24px;
      background: rgba(255, 252, 245, 0.88);
      border-radius: 20px;
      border: 1.5px dashed rgba(200, 150, 62, 0.55);
      color: var(--ink-muted);
    }
    .empty-state .big-box { font-size: 3.4rem; margin-bottom: 10px; }
    .stage-footer { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 20px; }
    @media (max-width: 768px) {
      .question-card-wrap { aspect-ratio: auto; min-height: 460px; padding: 20px 14px; background-size: cover; }
      .trilingual-board { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="seal-badge">中文嘉年华</span>
      <h1 class="brand-title">文化盲盒抽抽乐</h1>
      <span class="band-tag">Band 3 &amp; 4</span>
    </div>
    <div class="topbar-actions">
      <button id="backToPropsBtn" class="btn btn-secondary" style="display:none;" onclick="goToPropSelection()">← 重选道具</button>
      <button id="resetPoolBtn" class="btn btn-secondary" style="display:none;" onclick="resetCurrentPool()">重置本轮题库</button>
    </div>
  </header>

  <main class="container">
    <section id="stepOne">
      <div class="step-header">
        <div class="step-pill">第一步 · 选道具盲盒</div>
        <h2 class="step-title">请点击选取 1 个文化道具主题</h2>
        <p class="step-subtitle">每个道具对应 9 道 Band 3&amp;4 互动题，抽取后同时呈现简体、繁体与英语</p>
      </div>
      <div id="propGrid" class="prop-grid"></div>
    </section>

    <section id="stepTwo" class="stage-panel">
      <div class="blindbox-banner">
        <div class="selected-prop-info">
          <div id="activePropEmoji" class="selected-prop-emoji">🪭</div>
          <div class="selected-prop-titles">
            <h2 id="activePropTitle">扇子 · Fan</h2>
            <p id="activePropSub">已选道具盲盒 · 点击下方按钮随机抽取 1 道题</p>
          </div>
        </div>
        <div class="pool-status">
          <span id="poolCounterText" style="font-weight:700; font-size:0.95rem;">本轮剩余：9 / 9 题</span>
          <div id="poolDots" class="pool-dots"></div>
        </div>
      </div>

      <div id="questionCardWrap" class="question-card-wrap">
        <div id="emptyHint" class="empty-state">
          <div class="big-box">🎁</div>
          <p style="font-size:1.25rem; font-weight:800; color:#2c241b; margin-bottom:6px;">准备好抽取文化盲盒了吗？</p>
          <p>点击下方「随机抽一题」，揭晓本道具的 Band 3&amp;4 题目</p>
        </div>

        <div id="trilingualBoard" class="trilingual-board" style="display:none;">
          <div class="card-top-meta">
            <span id="cardTopicLabel">道具：扇子</span>
            <span id="cardQNum" class="q-num-pill">第 1 题</span>
          </div>
          <div class="lang-block zh-simp">
            <div class="lang-label">简体中文 · Simplified Chinese</div>
            <div id="textSimp" class="lang-text"></div>
          </div>
          <div class="lang-block zh-trad">
            <div class="lang-label">繁體中文 · Traditional Chinese</div>
            <div id="textTrad" class="lang-text"></div>
          </div>
          <div class="lang-block en-lang">
            <div class="lang-label">English · 英语</div>
            <div id="textEn" class="lang-text"></div>
          </div>
          <div id="answerBox" class="answer-box">
            <div class="answer-title">参考答案 · ANSWER</div>
            <div id="answerContent" class="answer-content"></div>
          </div>
        </div>
      </div>

      <div class="stage-footer">
        <button id="drawBtn" class="btn btn-primary" onclick="drawQuestion()">🎁 随机抽一题</button>
        <button id="toggleAnsBtn" class="btn btn-jade" style="display:none;" onclick="toggleAnswer()">👁️ 显示答案</button>
        <button id="nextDrawBtn" class="btn btn-gold" style="display:none;" onclick="drawQuestion()">🎲 再抽一题</button>
        <button class="btn btn-secondary" onclick="goToPropSelection()">换一个道具</button>
      </div>
    </section>
  </main>

ut the inkstick in the ________ and add water to grind ink. ( inkstone / schoolbag )", "ans": "砚台 / 硯台 / inkstone"}, {"num": 8, "simp": "8. 砚台大多是用________雕刻出来的，非常坚固耐用。（ 石头 / 棉花 ）", "trad": "8. 硯台大多是用________雕刻出來的，非常堅固耐用。（ 石頭 / 棉花 ）", "en": "8. Most inkstones are carved from ________, making them very strong and durable. ( stone / cotton )", "ans": "石头 / 石頭 / stone"}, {"num": 9, "simp": "9. 你知道砚台是怎么使用的吗？在砚台里加入________，就能磨出黑色的墨汁。（ 清水 / 沙子 ）", "trad": "9. 你知道硯台是怎麼使用的嗎？在硯台裡加入________，就能磨出黑色的墨汁。（ 清水 / 沙子 ）", "en": "9. Do you know how to use an inkstone? Add ________ into it to grind black ink. ( clear water / sand )", "ans": "清水 / 清水 / clear water"}]}, {"id": "calligraphy", "emoji": "📜", "zh": "书法", "trad": "書法", "en": "Calligraphy", "bgImage": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCALRBAADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEFAwQGAgcI/8QATxAAAQMDAgMFAwkDCQYGAgIDAQACAwQFERIhBjFBEyJRYXEUgZEHFSMyQlKhsdFUYsEkM0NTcpKTouEWNHOCsvElNTZjwvBEdBdkZdLi/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QALBEBAQACAgIBBAICAgIDAQAAAAECEQMhEjFBBBMiUTJhBXEUIxVSJDNCkf/aAAwDAQACEQMRAD8A+/HmoKHmhPgvK6G+FV17BXV8FGd4oz2so/6QrGSVsUTpHnDGDJJ8FVUVSYrRNc6rDTIHSk+Dfsj4KxnKt+qpIa2mfBOwPjcNwVTSVE9gY1lXXtdA5+mJ0rcnHgSF44V4k+eI3wyM0yMGppzkuaqXje4uqq0UDdooe87zdhWTvVcs+TGY+UWd440itkfZRMjqKhw20PyxvqVx1Xda27S66udz98hg2aPQKsdTuLCdJLAcasbD3qx4cZRfOTI7kXGFxw3fAB8/JdNSR4suTLkuq3bZQVNfIGU0LpPE8gPeupbaaKw0RrK8tqJh9Rn2dXp1XQQsp6OmxE1kUTRnu7ABclJBW8U3gvbmOihOlrj4fxKxO3o+3MJ13Vf2Ndfq5+hpklfuTya0foqWRro5Cxww5pwQvrNvoKe20whp2YHV3Vx8yuA4zt7qC9GdrfoaoagRyDuoW8b8OPNw2Y+Sqpqd8zJXR94RjU5o5geKy0lfVW2oE9LKWO6jo4eBCx2W4m23qCd28ROiQeLTzXS8RcLuDXVlsbraRqdEPzCtrnhhbj5Y/D0LtbOIKWSOdopq90Zbz+t6Hr6Lm7fxJXWOVxjeamnAAMTz4eBVQ8nWcggjpyIKwhz4jh2Xs/EKeK/ey3/b65a7/SXSAOicWSFuoxP2d/qvnfEN3uV+uLmOhlhpYnYjjLSPefNdbwrT0144YhZMwOkp3GNr2nDm+G66HW6jaG "trad": "1. 毛筆是中國傳統書房用具「文房四寶」之一。（ ✓ / × ）", "en": "1. The writing brush is one of the \"Four Treasures of the Study\" in traditional Chinese stationery. ( ✓ / × )", "ans": "✓ （正确 / 正確 / True）"}, {"num": 2, "simp": "2. 毛笔的笔头是用绿色植物的叶子做成的。（ ✓ / × ）", "trad": "2. 毛筆的筆頭是用綠色植物的葉子做成的。（ ✓ / × ）", "en": "2. The tip of a writing brush is made from green plant leaves. ( ✓ / × )", "ans": "× （错误，毛笔笔头是用动物毛发做成的 / 錯誤，毛筆筆頭是用動物毛髮做成的 / False, it is made from animal hair）"}, {"num": 3, "simp": "3. 下面哪一个是中国的传统书写工具？（ ）A. 铅笔  B. 毛笔  C. 钢笔", "trad": "3. 下面哪一個是中國的傳統書寫工具？（ ）A. 鉛筆  B. 毛筆  C. 鋼筆", "en": "3. Which of the following is a traditional Chinese writing tool? ( ) A. Pencil  B. Writing brush  C. Fountain pen", "ans": "B. 毛笔 / 毛筆 / Writing brush"}, {"num": 4, "simp": "4. 用毛笔写字的时候，需要搭配什么一起使用？（ ）A. 墨汁  B. 水彩笔  C. 蜡笔", "trad": "4. 用毛筆寫字的時候，需要搭配什麼一起使用？（ ）A. 墨汁  B. 水彩筆  C. 蠟筆", "en": "4. What do you need to use together with a writing brush when writing? ( ) A. Ink  B. Watercolor marker  C. Crayon", "ans": "A. 墨汁 / 墨汁 / Ink"}, {"num": 5, "simp": "5. 下面哪一个物品和中国书法关系最密切？（ ）A. 毛笔  B. 风筝  C. 气球", "trad": "5. 下面哪一個物品和中國書法關係最密切？（ ）A. 毛筆  B. 風箏  C. 氣球", "en": "5. Which item is most closely connected to Chinese calligraphy? ( ) A. Writing brush  B. Kite  C. Balloon", "ans": "A. 毛笔 / 毛筆 / Writing brush"}, {"num": 6, "simp": "6. 下面哪一个物品不属于中国传统的“文房四宝”？（ ）A. 毛笔  B. 橡皮  C. 砚台", "trad": "6. 下面哪一個物品不屬於中國傳統的「文房四寶」？（ ）A. 毛筆  B. 橡皮  C. 硯台", "en": "6. Which item does NOT belong to the traditional \"Four Treasures of the Study\"? ( ) A. Writing brush  B. Eraser  C. Inkstone", "ans": "B. 橡皮 / 橡皮 / Eraser"}, {"num": 7, "simp": "7. 春节的时候，人们经常用________来写红色的对联和“福”字。（ 毛笔 / 尺子 ）", "trad": "7. 春節的時候，人們經常常用________來寫紅色的對聯和「福」字。（ 毛筆 / 尺子 ）", "en": "7. During Spring Festival, people often use a ________ to write red couplets and the character \"Fu\". ( writing brush / ruler )", "ans": "毛笔 / 毛筆 / writing brush"}, {"num": 8, "simp": "8. 毛笔主要有两个部分：下面软软的用来蘸墨的是笔头，上面长长用来拿的是________。（ 笔杆 / 橡皮 ）", "trad": "8. 毛筆主要有兩個部分：下面軟軟的用來蘸墨的是筆頭，上面長長用來拿的是________。（ 筆桿 / 橡皮 ）", "en": "8. A brush mainly has two parts: the soft tip at the bottom for dipping ink, and the long part at the top for holding is the ________. ( brush shaft / eraser )", "ans": "笔杆 / 筆桿 / brush shaft"}, {"num": 9, "simp": "9. 你知道“狼毫”毛笔吗？请选出正确的答案：狼毫毛笔的笔头是用动物的________做成的。（ 毛发 / 骨头 ）", "trad": "9. 你知道「狼毫」毛筆嗎？請選出正確的答案：狼毫毛筆的筆頭是用動物的________做出來的。（ 毛髮 / 骨頭 ）", "en": "9. Do you know about \"Langhao\" brushes? Choose the right answer: the tip of a Langhao brush is made from animal ________. ( hair / bones )", "ans": "毛发 / 毛髮 / hair"}]}];

    function formatMarks(str) {
      return str
        .replace(/✓/g, '<span class="mark-tick">✓</span>')
        .replace(/×/g, '<span class="mark-cross">×</span>');
    }

    const state = { selectedPropId: null, remainingMap: {}, currentQNum: null, answerVisible: false };
    CULTURE_DATA.forEach(item => { state.remainingMap[item.id] = item.questions.map((_, idx) => idx); });

    function renderPropGrid() {
      const grid = document.getElementById("propGrid");
      grid.innerHTML = "";
      CULTURE_DATA.forEach((prop, index) => {
        const card = document.createElement("div");
        card.className = "prop-card";
        card.onclick = () => selectProp(prop.id);
        card.innerHTML = `
          <div class="prop-icon-box">${prop.emoji}</div>
          <div class="prop-name-zh">${prop.zh}</div>
          <div class="prop-name-sub">${prop.trad}</div>
          <div class="prop-name-en">${prop.en}</div>
          <div class="prop-meta">盲盒 #${index + 1} · 9 题</div>
        `;
        grid.appendChild(card);
      });
    }

    function selectProp(propId) {
      state.selectedPropId = propId;
      state.currentQNum = null;
      state.answerVisible = false;
      const prop = CULTURE_DATA.find(p => p.id === propId);

      document.getElementById("stepOne").style.display = "none";
      document.getElementById("stepTwo").classList.add("active");
      document.getElementById("backToPropsBtn").style.display = "inline-flex";
      document.getElementById("resetPoolBtn").style.display = "inline-flex";

      document.getElementById("activePropEmoji").textContent = prop.emoji;
      document.getElementById("activePropTitle").textContent = `${prop.zh}（${prop.trad}）· ${prop.en}`;
      document.getElementById("activePropSub").textContent = `已选道具盲盒 · Band 3&4 专属题库（共 ${prop.questions.length} 题）`;

      const wrap = document.getElementById("questionCardWrap");
      wrap.style.backgroundImage = `url("${prop.bgImage}")`;

      document.getElementById("emptyHint").style.display = "block";
      document.getElementById("trilingualBoard").style.display = "none";
      document.getElementById("answerBox").classList.remove("visible");
      document.getElementById("drawBtn").style.display = "inline-flex";
      document.getElementById("toggleAnsBtn").style.display = "none";
      document.getElementById("nextDrawBtn").style.display = "none";
      updatePoolUI(prop);
    }

    function goToPropSelection() {
      state.selectedPropId = null;
      document.getElementById("stepTwo").classList.remove("active");
      document.getElementById("stepOne").style.display = "block";
      document.getElementById("backToPropsBtn").style.display = "none";
      document.getElementById("resetPoolBtn").style.display = "none";
    }

    function resetCurrentPool() {
      if (!state.selectedPropId) return;
      const prop = CULTURE_DATA.find(p => p.id === state.selectedPropId);
      state.remainingMap[prop.id] = prop.questions.map((_, idx) => idx);
      state.currentQNum = null;
      state.answerVisible = false;

      document.getElementById("emptyHint").style.display = "block";
      document.getElementById("trilingualBoard").style.display = "none";
      document.getElementById("answerBox").classList.remove("visible");
      document.getElementById("drawBtn").style.display = "inline-flex";
      document.getElementById("toggleAnsBtn").style.display = "none";
      document.getElementById("nextDrawBtn").style.display = "none";
      updatePoolUI(prop);
    }

    function drawQuestion() {
      const prop = CULTURE_DATA.find(p => p.id === state.selectedPropId);
      if (!prop) return;

      let pool = state.remainingMap[prop.id];
      if (!pool || pool.length === 0) {
        pool = prop.questions.map((_, idx) => idx);
        state.remainingMap[prop.id] = pool;
      }

      const pickPos = Math.floor(Math.random() * pool.length);
      const qIndex = pool.splice(pickPos, 1)[0];
      const q = prop.questions[qIndex];
      state.currentQNum = q.num;
      state.answerVisible = false;

      const wrap = document.getElementById("questionCardWrap");
      wrap.classList.remove("shaking");
      void wrap.offsetWidth;
      wrap.classList.add("shaking");

      document.getElementById("emptyHint").style.display = "none";
      document.getElementById("trilingualBoard").style.display = "block";
      document.getElementById("cardTopicLabel").textContent = `${prop.emoji} ${prop.zh} / ${prop.trad} / ${prop.en} · Band 3&4`;
      document.getElementById("cardQNum").textContent = `第 ${q.num} 题`;

      document.getElementById("textSimp").innerHTML = formatMarks(q.simp);
      document.getElementById("textTrad").innerHTML = formatMarks(q.trad);
      document.getElementById("textEn").innerHTML = formatMarks(q.en);

      document.getElementById("answerContent").innerHTML = formatMarks(q.ans);
      const ansBox = document.getElementById("answerBox");
      ansBox.classList.remove("visible");

      const ansBtn = document.getElementById("toggleAnsBtn");
      ansBtn.textContent = "👁️ 显示答案";
      ansBtn.style.display = "inline-flex";

      document.getElementById("drawBtn").style.display = "none";
      document.getElementById("nextDrawBtn").style.display = "inline-flex";
      updatePoolUI(prop);
    }

    function toggleAnswer() {
      state.answerVisible = !state.answerVisible;
      const ansBox = document.getElementById("answerBox");
      const ansBtn = document.getElementById("toggleAnsBtn");
      if (state.answerVisible) {
        ansBox.classList.add("visible");
        ansBtn.textContent = "🙈 隐藏答案";
      } else {
        ansBox.classList.remove("visible");
        ansBtn.textContent = "👁️ 显示答案";
      }
    }

    function updatePoolUI(prop) {
      const remIndices = state.remainingMap[prop.id];
      const total = prop.questions.length;
      const remCount = remIndices.length;

      document.getElementById("poolCounterText").textContent =
        remCount === 0 ? `本轮 ${total} 题已抽完（再抽将自动新开一轮）` : `本轮剩余：${remCount} / ${total} 题`;

      const dotsEl = document.getElementById("poolDots");
      dotsEl.innerHTML = "";
      for (let i = 0; i < total; i++) {
        const dot = document.createElement("span");
        const qNum = i + 1;
        const isRemaining = remIndices.includes(i);
        dot.className = "dot";
        if (qNum === state.currentQNum) {
          dot.classList.add("current");
        } else if (!isRemaining) {
          dot.classList.add("used");
        }
        dot.title = `第 ${qNum} 题`;
        dotsEl.appendChild(dot);
      }
    }

    renderPropGrid();
  </script>
